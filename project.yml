name: vMixrInterface
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  vMixrInterface:
    type: application
    platform: macOS
    sources:
      - path: Sources/vMixrInterface
      - path: AppIcon.icns
    dependencies:
      - target: AudioKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ktam72.vMixrInterface
        PRODUCT_NAME: vMixrInterface
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.audio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: vMixrInterface
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_HARDENED_RUNTIME: NO
  AudioKit:
    type: framework
    platform: macOS
    sources:
      - path: Sources/AudioKit
    settings:
      base:
        PRODUCT_MODULE_NAME: AudioKit
        PRODUCT_NAME: AudioKit
        SKIP_INSTALL: NO
        ENABLE_MODULE_VERIFIER: NO
        DEFINES_MODULE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        ENABLE_HARDENED_RUNTIME: NO
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AudioKit
        INFOPLIST_KEY_CFBundleIdentifier: com.ktam72.AudioKit
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
schemes:
  vMixrInterface:
    build:
      targets:
        vMixrInterface: all
    run:
      config: Debug
    test:
      config: Debug
